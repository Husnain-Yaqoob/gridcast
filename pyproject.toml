[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcast"
version = "0.1.0"
description = "Ingest Irish grid data from EirGrid and forecast wind generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hussnain Yaqoob" }]

dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# Kept separate so the ingest pipeline can run on a machine that does not need
# the modelling stack. A scheduled job should not be pulling in scikit-learn.
analysis = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
gridcast = "gridcast.cli:main"

[tool.setuptools.packages.find]
include = ["gridcast*"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` cannot import the package, while
# `python -m pytest` can. That inconsistency wastes an hour the first time it
# happens, so it is settled here once.
pythonpath = ["."]
testpaths = ["tests"]
